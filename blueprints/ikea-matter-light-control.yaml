blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: ylatef
  domain: automation
  name: IKEA Matter Switch - Light Control
  description: >
    ## 💡 Control a light with IKEA Matter Switch
        
    Control a single light using an IKEA Matter switch with dual buttons.

    Available controls:
      - Press **button 1** to toggle the light
      - Press **button 2** to toggle the light
      - Double-press **button 1** to set brightness to 100%
      - Hold **button 1** to increase brightness
      - Double-press **button 2** to set brightness to 10%
      - Hold **button 2** to decrease brightness
  input:
    matter_switch:
      name: IKEA Bilresa Dual Button Switch
      description: IKEA Bilresa Dual Button switch device to use
      selector:
        device:
          filter:
            - integration: matter
              manufacturer: IKEA of Sweden
              model: BILRESA dual button
          multiple: false
    target_light:
      name: Light
      description: Light to control
      selector:
        entity:
          filter:
            domain: light
          multiple: false

mode: restart
max_exceeded: silent

variables:
  target_light: !input target_light
  matter_switch: !input matter_switch
  helper_hold_delay: 0.1
  helper_hold_dim_step: 4
  button1_entity: "{{ device_entities(matter_switch) | select('search', 'button_1') | select('search', 'event') | list | first }}"
  button2_entity: "{{ device_entities(matter_switch) | select('search', 'button_2') | select('search', 'event') | list | first }}"
  triggered_entity: "{{ trigger.event.data.entity_id }}"
  event_type: "{{ trigger.event.data.new_state.attributes.event_type if trigger.event.data.new_state else '' }}"

triggers:
  - platform: event
    event_type: state_changed
    event_data:
      entity_id: "{{ device_entities(matter_switch) | select('search', 'button_1') | select('search', 'event') | list | first }}"

actions:
  - variables:
      event_type: "{{ trigger.event.data.new_state.attributes.event_type if trigger.event.data.new_state and trigger.event.data.new_state.attributes else '' }}"
      triggered_entity: "{{ trigger.event.data.entity_id }}"
  - choose:
      # Button 1 Single Press - Toggle Light
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_entity and event_type == 'initial_press' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light
            data: {}
      
      # Button 2 Single Press - Toggle Light
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_entity and event_type == 'initial_press' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light
            data: {}
      
      # Button 1 Double Press - Set Brightness to 100%
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_entity and event_type == 'multi_press_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 100
      
      # Button 1 Hold - Continuously Increase Brightness
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_entity and event_type == 'long_press' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_step_pct: "{{ helper_hold_dim_step }}"
                - delay:
                    milliseconds: 100
      
      # Button 2 Double Press - Set Brightness to 10%
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_entity and event_type == 'multi_press_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 10
      
      # Button 2 Hold - Continuously Decrease Brightness
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_entity and event_type == 'long_press' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ state_attr(target_light, 'brightness') | int(0) > 3 }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                - delay:
                    milliseconds: 100
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 1