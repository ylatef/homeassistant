blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: ylatef
  domain: automation
  name: IKEA Matter Switch - Light Control
  description: >
    ## 💡 Control a light with IKEA Matter Switch
        
    Control a single light using an IKEA Matter switch with dual buttons.

    Available controls:
      - Press **button 1** to toggle the light
      - Press **button 2** to toggle the light
      - Double-press **button 1** to set brightness to 100%
      - Hold **button 1** to increase brightness
      - Double-press **button 2** to set brightness to 10%
      - Hold **button 2** to decrease brightness
  input:
    button1_event:
      name: Button 1 Event Entity
      description: Select the Button 1 event entity (e.g., event.bilresa_dual_button_button_1)
      selector:
        entity:
          filter:
            - domain: event
          multiple: false
    button2_event:
      name: Button 2 Event Entity
      description: Select the Button 2 event entity (e.g., event.bilresa_dual_button_button_2)
      selector:
        entity:
          filter:
            - domain: event
          multiple: false
    target_light:
      name: Light
      description: Light to control
      selector:
        entity:
          filter:
            domain: light
          multiple: false

mode: restart
max_exceeded: silent

triggers:
  # Button 1 - All Events
  - platform: state
    entity_id: !input button1_event
    id: button1-event
  
  # Button 2 - All Events
  - platform: state
    entity_id: !input button2_event
    id: button2-event

variables:
  target_light: !input target_light
  button1_event: !input button1_event
  button2_event: !input button2_event
  helper_hold_delay: 0.1
  helper_hold_dim_step: 4
  event_type: "{{ trigger.to_state.state if trigger.to_state else '' }}"
  triggered_entity: "{{ trigger.entity_id }}"

actions:
  - choose:
      # Button 1 Single Press - Toggle Light
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_event and event_type in ['initial_press', 'short_release'] }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light
            data: {}
      
      # Button 2 Single Press - Toggle Light
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_event and event_type in ['initial_press', 'short_release'] }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light
            data: {}
      
      # Button 1 Double Press - Set Brightness to 100%
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_event and event_type == 'multi_press_complete' }}"
        sequence:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.multi_press_count | int(0) == 2 }}"
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 100
      
      # Button 1 Hold - Continuously Increase Brightness
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button1_event and event_type == 'long_press' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_step_pct: "{{ helper_hold_dim_step }}"
                - delay:
                    milliseconds: 100
      
      # Button 2 Double Press - Set Brightness to 10%
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_event and event_type == 'multi_press_complete' }}"
        sequence:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.multi_press_count | int(0) == 2 }}"
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 10
      
      # Button 2 Hold - Continuously Decrease Brightness
      - conditions:
          - condition: template
            value_template: "{{ triggered_entity == button2_event and event_type == 'long_press' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ state_attr(target_light, 'brightness') | int(0) > 3 }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                - delay:
                    milliseconds: 100
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 1